name: Deploy demo sites to GitHub Pages

on:
  push:
    branches: [main, claude/gracious-pascal-22xlvf]
    paths: [template/**, clients/**, presets/**, scripts/**, .github/workflows/deploy-demos.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs all
      - name: Block indexing of the demo host
        run: printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
